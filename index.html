<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.webmanifest">
<title>SaxCoach v3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f1ed;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:700px;margin:auto;min-height:100vh;background:#fff;padding:18px 18px 32px}
header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800}.status{font-size:12px;font-weight:700;background:#e8f7ea;color:#28743a;padding:7px 10px;border-radius:20px}
h1{font-size:30px;line-height:1.05;margin:25px 0 7px}.sub{color:#666;margin:0 0 18px}
.card{border:1px solid #e5e0d8;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #00000009}
.scan{height:190px;border:2px dashed #bbb2a8;border-radius:16px;background:#f5f1eb;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.scan .icon{font-size:45px}.scan b{margin-top:6px}.scan small{color:#777;margin-top:4px}
input[type=file]{display:none}.preview{display:none;width:100%;max-height:330px;object-fit:contain;border-radius:14px;background:#eee;margin-top:12px}
.actions{display:flex;gap:9px;margin-top:10px}.btn{flex:1;padding:13px;border:0;border-radius:13px;font-weight:800;font-size:15px}.primary{background:#171717;color:#fff}.light{background:#eee9e2}
.row{display:flex;gap:10px}.field{flex:1}.label{font-size:12px;color:#666;font-weight:700;margin-bottom:6px}
select,input[type=number]{width:100%;padding:12px;border:1px solid #ddd7cf;border-radius:12px;background:#fff;font-size:16px}
.result{display:none}.result h2{font-size:18px;margin:0 0 10px}.sequence{display:flex;flex-wrap:wrap;gap:7px}.pill{border:1px solid #ddd7cf;border-radius:12px;padding:9px 11px;background:#faf8f5;font-weight:750}.pill.active{background:#eaf2ff;border-color:#1677ff;color:#1261ce}
.sheet{background:#fffdf9;border:1px solid #e1dbd2;border-radius:16px;padding:12px}.staff{height:120px;position:relative}.lines{position:absolute;left:0;right:0;top:28px}.lines div{height:17px;border-top:1px solid #999}
.notes{position:absolute;top:5px;left:0;right:0;display:flex;justify-content:space-around;font-size:31px}.note{width:34px;text-align:center}.note small{display:block;font-size:10px;font-weight:800;margin-top:-4px}.note.active{color:#1677ff;text-shadow:0 0 12px #1677ff55}
.current{text-align:center}.current strong{font-size:40px}.current small{display:block;color:#777}
.progress{height:6px;background:#eee9e2;border-radius:9px;margin-top:14px}.bar{height:100%;width:16%;background:#1677ff;border-radius:9px}
.controls{display:flex;gap:9px;margin-top:12px}.play{flex:1;padding:14px;border:0;border-radius:14px;background:#171717;color:#fff;font-size:17px;font-weight:800}.reset{padding:14px 17px;border:1px solid #ddd7cf;background:#fff;border-radius:14px}
.noteinfo{font-size:13px;color:#666;line-height:1.45}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🎷 SaxCoach</div><div class="status">● Offline</div></header>
<h1>Scan dine noder</h1><p class="sub">Tag et billede af saxofonnoderne og gør dem klar til øvning.</p>

<section class="card">
<label class="scan" for="photo"><div class="icon">📷</div><b>Tag billede af nodearket</b><small>eller vælg et billede fra Fotos</small></label>
<input id="photo" type="file" accept="image/*" capture="environment">
<img id="preview" class="preview" alt="Nodeark">
<div class="actions">
<button class="btn primary" id="analyze" disabled>🎼 Genkend noder</button>
<button class="btn light" id="demo">Demo</button>
</div>
</section>

<section class="card">
<div class="row">
<div class="field"><div class="label">Saxofon</div><select><option>Altsaxofon (Eb)</option><option>Tenorsaxofon (Bb)</option><option>Sopransaxofon (Bb)</option><option>Barytonsaxofon (Eb)</option></select></div>
<div class="field"><div class="label">Tempo · BPM</div><input id="tempo" type="number" value="90" min="30" max="240"></div>
</div>
</section>

<section class="card result" id="result">
<h2>Genkendte noder · Do-Re-Mi</h2>
<div class="sequence" id="sequence"></div>
<p class="noteinfo" id="info"></p>
</section>

<section class="card">
<div class="label">Følg noderne</div>
<div class="sheet"><div class="staff"><div class="lines"><div></div><div></div><div></div><div></div><div></div></div><div class="notes" id="notes"></div></div>
<div class="current"><strong id="current">—</strong><small>Spil denne node nu</small></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="controls"><button class="play" id="play">▶ Start</button><button class="reset" id="reset">↺</button></div>
</section>
</div>

<script>
const photo=document.querySelector('#photo'),preview=document.querySelector('#preview'),analyze=document.querySelector('#analyze');
const result=document.querySelector('#result'),sequence=document.querySelector('#sequence'),notesEl=document.querySelector('#notes');
const current=document.querySelector('#current'),bar=document.querySelector('#bar'),play=document.querySelector('#play');
let seq=['Do','Re','Mi','Fa','Sol','La'],i=0,timer=null;

photo.onchange=()=>{const f=photo.files[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.style.display='block';analyze.disabled=false};
function showSequence(){result.style.display='block';sequence.innerHTML=seq.map((n,k)=>`<span class="pill" data-k="${k}">${n}</span>`).join('');renderNotes();document.querySelector('#info').textContent='Dette er en prototype: billedet vises korrekt, og demoen laver en nodefølge. Ægte automatisk nodegenkendelse (OMR) er næste tekniske modul.'}
function renderNotes(){notesEl.innerHTML=seq.slice(0,8).map((n,k)=>`<div class="note ${k===i?'active':''}">●<small>${n}</small></div>`).join('');current.textContent=seq[i]||'—';bar.style.width=((i+1)/seq.length*100)+'%'}
analyze.onclick=()=>showSequence();
document.querySelector('#demo').onclick=()=>{seq=['Do','Re','Mi','Fa','Sol','Sol','Fa','Mi'];i=0;showSequence()};
function tick(){i=(i+1)%seq.length;renderNotes()}
play.onclick=()=>{if(timer){clearInterval(timer);timer=null;play.textContent='▶ Start';return}let bpm=Math.max(30,Math.min(240,+document.querySelector('#tempo').value||90));renderNotes();timer=setInterval(tick,60000/bpm);play.textContent='⏸ Pause'};
document.querySelector('#reset').onclick=()=>{clearInterval(timer);timer=null;i=0;play.textContent='▶ Start';renderNotes()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
